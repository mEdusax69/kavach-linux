set timeout=8
set default=0
set gfxpayload=keep
insmod all_video

menuentry "Kavach Linux 1.0 (Rakshak) - Live" {
    linux /casper/vmlinuz boot=casper username=kavach hostname=kavach quiet loglevel=3 ---
    initrd /casper/initrd
}
menuentry "Kavach Linux 1.0 - Live (safe graphics: nomodeset)" {
    linux /casper/vmlinuz boot=casper username=kavach hostname=kavach nomodeset ---
    initrd /casper/initrd
}
menuentry "Kavach Linux 1.0 - Live (verbose boot messages)" {
    linux /casper/vmlinuz boot=casper username=kavach hostname=kavach ---
    initrd /casper/initrd
}
